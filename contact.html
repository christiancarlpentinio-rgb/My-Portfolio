<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Christian's Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">Christian's Portfolio</a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Contact Me</h1>

        <!-- Contact information -->
        <section class="card">
            <h2>Get in Touch</h2>
            <p><strong>Email:</strong> christiancarlpentinio@gmail.com</p>
            <p><strong>Location:</strong> Philippines</p>
        </section>

        <!-- Contact form -->
        <section class="card">
            <h2>Send a Message</h2>
            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="btn">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Christian. All rights reserved.</p>
    </footer>
</body>
</html>
